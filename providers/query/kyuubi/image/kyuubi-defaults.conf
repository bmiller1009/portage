# Kyuubi server + embedded Spark engine defaults (docs/architecture/spec.md
# §38/§68). spark.master=local[*] runs Spark inside the Kyuubi pod itself —
# Kyuubi's own YARN/Kubernetes engine-launch mechanisms are a separate,
# heavier concern this project's Spark-Operator-based submission path
# (providers/execution/kubernetes/) doesn't need.
#
# The spark.sql.catalog.portage_iceberg.* block registers the same
# Iceberg REST catalog Trino uses (deploy/dev/trino.yaml) and Portage's
# own table dataset bindings resolve into per-run
# (spec/dataset/v1alpha1.py's resolve_iceberg_catalog_config()) — baked
# in statically here instead, since Kyuubi is a standing JDBC gateway an
# analyst connects to directly, not something Portage submits a run
# against. Credentials/bucket are the same dev-only values already
# committed in deploy/dev/minio.yaml, iceberg-rest.yaml, and trino.yaml.
#
# This baked-in copy is the default (so `docker run portage/kyuubi` works
# standalone for local testing) — deploy/dev/kyuubi.yaml mounts an
# identical copy via ConfigMap at the same path, letting a real
# deployment override endpoint/credentials/warehouse without rebuilding
# the image.

spark.master                                            local[*]

kyuubi.frontend.bind.host                               0.0.0.0

spark.sql.extensions                                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.portage_iceberg                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.portage_iceberg.type                  rest
spark.sql.catalog.portage_iceberg.uri                   http://iceberg-rest.portage-storage.svc.cluster.local:8181
spark.sql.catalog.portage_iceberg.warehouse             s3a://portage-local/iceberg-warehouse
spark.sql.catalog.portage_iceberg.client.region         us-east-1
spark.sql.catalog.portage_iceberg.s3.endpoint           http://minio.portage-storage.svc.cluster.local:9000
spark.sql.catalog.portage_iceberg.s3.access-key-id      portage-dev
spark.sql.catalog.portage_iceberg.s3.secret-access-key  portage-dev-secret
spark.sql.catalog.portage_iceberg.s3.path-style-access  true
