name: Release

# Never auto-tags — only reacts to a tag a human already pushed (or a
# workflow_dispatch naming one). `make release VERSION=X.Y.Z`
# (scripts/release-check.sh) is what a human runs first to prove the tree
# is release-ready; only after that passes does `git tag vX.Y.Z && git push
# origin vX.Y.Z` actually trigger this workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0) — must already exist"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Compute checksums
        run: |
          (cd dist && sha256sum -- * ) > "portage-runtime-${{ steps.version.outputs.version }}-checksums.txt"

      - name: Generate Python package SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: portage-runtime-${{ steps.version.outputs.version }}-sbom.cdx.json

      - uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          mkdir -p dist-helm
          helm package charts/portage \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist-helm

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version-specific tag only, never a bare `latest`-only push (req
      # #19) — the immutable digest this step produces is what the release
      # notes below actually pin, since a tag can be reassigned but a
      # digest can't.
      - name: Build and push container image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}

      - name: Generate container image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: portage-control-plane-${{ steps.version.outputs.version }}-sbom.cdx.json

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for the full ${{ steps.version.outputs.version }} release notes.

            Container image: `ghcr.io/${{ github.repository }}@${{ steps.docker.outputs.digest }}`
          files: |
            dist/*
            dist-helm/*
            portage-runtime-${{ steps.version.outputs.version }}-checksums.txt
            portage-runtime-${{ steps.version.outputs.version }}-sbom.cdx.json
            portage-control-plane-${{ steps.version.outputs.version }}-sbom.cdx.json
