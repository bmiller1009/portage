name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        run: pyright

      - name: Unit tests
        run: pytest tests/unit -v

      # These already run as part of "Unit tests" above (they live under
      # tests/unit/, not tests/contract/security/conformance/ — see
      # tests/README.md for why) — labeled separately so CI visibly proves
      # portability/security/conformance got checked, not just "some
      # tests passed somewhere."
      - name: Provider contract tests
        run: pytest tests/unit/test_execution_provider_contracts.py tests/unit/test_storage_provider_contracts.py -v

      - name: Security tests
        run: pytest tests/unit/test_auth.py tests/unit/test_api_auth_enforcement.py -v

      - name: Conformance tests
        run: pytest tests/unit/test_conformance.py tests/unit/test_certification.py tests/unit/test_api_conformance_router.py tests/unit/test_api_certification_router.py tests/unit/test_cli_conformance.py tests/unit/test_cli_certification.py -v

      - name: OpenAPI schema drift check
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json || (echo "::error::openapi.json is out of date — run 'python scripts/export_openapi.py' and commit the result." && exit 1)

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/portage-wheel-venv
          /tmp/portage-wheel-venv/bin/pip install dist/*.whl

      - name: Smoke-test the installed CLI (not editable-source execution)
        run: |
          /tmp/portage-wheel-venv/bin/plane --version
          /tmp/portage-wheel-venv/bin/plane --help

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t portage/control-plane:ci .

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/portage

      - name: helm template
        run: helm template charts/portage --set database.existingSecretName=ci-placeholder

  persistence-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portage
          POSTGRES_PASSWORD: portage
          POSTGRES_DB: portage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portage:portage@localhost:5432/portage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Persistence tests
        run: pytest tests/integration/db -v
