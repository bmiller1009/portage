[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-portage"
version = "0.1.0"
description = "Apache Airflow provider for Portage (docs/architecture/spec.md §69) -- calls the public job API (spec §31/§39: cross-system orchestrators call the API, Portage does not become an Airflow replacement)."
requires-python = ">=3.10"
dependencies = ["apache-airflow>=3.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.entry-points.apache_airflow_provider]
provider_info = "airflow_provider_portage.get_provider_info:get_provider_info"

[tool.setuptools.packages.find]
include = ["airflow_provider_portage*"]
