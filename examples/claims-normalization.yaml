apiVersion: runtime/v1
kind: SparkWorkload

metadata:
  name: claims-normalization
  version: "4.18.2"

runtime:
  # 4.1, not 4.2 (unlike wordcount.yaml) — this is the cross-provider
  # hero-demo fixture (spec §66), and 4.1 is the newest Spark version both
  # the Kubernetes Spark Operator and Databricks Runtime actually support
  # today (no Databricks Runtime ships 4.2 yet, see
  # providers/execution/databricks/provider.py's _SUPPORTED_SPARK_VERSIONS).
  spark: "4.1"

application:
  type: python-wheel
  artifact: artifact://claims-normalization/4.18.2
  entryPoint: claims.jobs.normalize

arguments:
  - "--business-date"
  - "${RUN_DATE}"

datasets:
  inputs:
    claims:
      dataset: claims.raw
    reference:
      dataset: provider.reference

  outputs:
    normalized:
      dataset: claims.normalized

resources:
  driver:
    cores: 2
    memory: 8Gi

  executor:
    cores: 4
    memory: 16Gi

  scaling:
    minExecutors: 10
    maxExecutors: 100

execution:
  timeout: 4h
  retries: 0
