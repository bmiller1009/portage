apiVersion: runtime/v1alpha1
kind: SparkWorkload

metadata:
  name: claims-normalization
  version: "4.18.2"

runtime:
  spark: "4.2"

application:
  type: python-wheel
  artifact: artifact://claims-normalization/4.18.2
  entryPoint: claims.jobs.normalize

arguments:
  - "--business-date"
  - "${RUN_DATE}"

datasets:
  inputs:
    claims:
      dataset: claims.raw
    reference:
      dataset: provider.reference

  outputs:
    normalized:
      dataset: claims.normalized

resources:
  driver:
    cores: 2
    memory: 8Gi

  executor:
    cores: 4
    memory: 16Gi

  scaling:
    minExecutors: 10
    maxExecutors: 100

execution:
  timeout: 4h
  retries: 0
