apiVersion: runtime/v1alpha1
kind: SparkWorkload

metadata:
  name: wordcount
  version: "0.1.0"

runtime:
  spark: "4.2"

application:
  type: python-wheel
  artifact: artifact://wordcount/0.1.0
  entryPoint: wordcount.jobs.count

arguments:
  - "--business-date"
  - "${RUN_DATE}"

datasets:
  inputs:
    text:
      dataset: wordcount.raw

  outputs:
    counts:
      dataset: wordcount.counts

resources:
  driver:
    cores: 1
    memory: 2Gi

  executor:
    cores: 1
    memory: 2Gi

  scaling:
    minExecutors: 1
    maxExecutors: 2

execution:
  timeout: 30m
  retries: 0
