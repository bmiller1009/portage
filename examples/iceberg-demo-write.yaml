apiVersion: runtime/v1
kind: SparkWorkload

metadata:
  name: iceberg-demo-write
  version: "0.2.0"

runtime:
  spark: "4.1"

application:
  type: python-wheel
  artifact: artifact://iceberg-demo/0.1.0
  entryPoint: iceberg_demo.jobs.write_demo_table

datasets:
  outputs:
    table:
      dataset: demo.table

resources:
  driver:
    cores: 1
    memory: 2Gi

  executor:
    cores: 1
    memory: 2Gi

  scaling:
    minExecutors: 1
    maxExecutors: 1

execution:
  timeout: 15m
  retries: 0
