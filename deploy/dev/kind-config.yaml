# kind cluster shape used throughout Phase 0/v0.1 development (see
# docs/providers/kubernetes.md) — one control-plane node, two workers.
# Confirmed live against kind node image v1.34.0 (spec §46: Kubernetes
# 1.34+).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
