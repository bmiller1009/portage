[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portage"
version = "0.0.1"
description = "Portable Spark Runtime — a control plane for running Apache Spark workloads independently of the infrastructure on which they execute."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "typer>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1",
]

[project.scripts]
plane = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["api", "control_plane", "reconciler", "providers", "spec", "conformance", "cli", "sdk/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
