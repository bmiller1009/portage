[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portage"
version = "0.0.1"
description = "Portable Spark Runtime — a control plane for running Apache Spark workloads independently of the infrastructure on which they execute."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "typer>=0.13",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "kubernetes>=31.0",
    "databricks-sdk>=0.36",
    "azure-storage-file-datalake>=12.14",
    "azure-identity>=1.15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    # Semantic result comparison (spec §22, §67): reads Parquet output
    # directly via pyarrow's S3 filesystem — no PySpark/JVM needed for a
    # read-only comparison, and pyspark is intentionally not a portage
    # dependency (see examples/wordcount_app's own pyproject.toml).
    "pyarrow>=17.0",
    # OIDC (spec §33-34, §67): JWT verification against a JWKS endpoint —
    # RS256 needs the cryptography backend, since real IdPs (Entra/Okta/
    # Ping) never issue HS256 (symmetric-key) tokens for a public JWKS flow.
    "pyjwt[crypto]>=2.9",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    # opentelemetry-exporter-prometheus is still pre-1.0 upstream (a 0.x
    # "b0" beta series tracking the api/sdk major version, not a sign it's
    # unmaintained) — pin the exact version known to work with the api/sdk
    # floor above rather than a loose >= against a pre-release series.
    "opentelemetry-exporter-prometheus==0.65b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1",
    "moto[s3]>=5.0",
    "build>=1.2",
]

[project.scripts]
plane = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["api", "control_plane", "reconciler", "providers", "spec", "conformance", "cli", "sdk/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is Depends(...) in argument defaults —
# that's the framework's idiom, not the antipattern B008 flags.
"api/routers/*.py" = ["B008"]
"api/auth.py" = ["B008"]
# Typer's own idiom for a repeatable CLI option is `list[str] =
# typer.Option([])` in the argument default — same category of false
# positive as the FastAPI case above.
"cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.pyright]
# examples/wordcount_app and examples/iceberg_demo_app are standalone
# packages (their own pyproject.toml, run inside the Spark container
# image, not the portage venv) — pyspark is intentionally not a portage
# dependency, so they're out of scope here.
exclude = ["examples/wordcount_app", "examples/iceberg_demo_app", ".venv", "build", "dist"]
