[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portage"
version = "0.0.1"
description = "Portable Spark Runtime — a control plane for running Apache Spark workloads independently of the infrastructure on which they execute."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "typer>=0.13",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "kubernetes>=31.0",
    "databricks-sdk>=0.36",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1",
    "moto[s3]>=5.0",
    "build>=1.2",
    "httpx>=0.27",
]

[project.scripts]
plane = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["api", "control_plane", "reconciler", "providers", "spec", "conformance", "cli", "sdk/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is Depends(...) in argument defaults —
# that's the framework's idiom, not the antipattern B008 flags.
"api/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.pyright]
# examples/wordcount_app is a standalone package (its own pyproject.toml,
# runs inside the Spark container image, not the portage venv) — pyspark
# is intentionally not a portage dependency, so it's out of scope here.
exclude = ["examples/wordcount_app", ".venv", "build", "dist"]
