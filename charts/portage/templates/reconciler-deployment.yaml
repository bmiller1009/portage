apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portage.fullname" . }}-reconciler
  labels:
    {{- include "portage.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
spec:
  replicas: {{ .Values.reconciler.replicaCount }}
  selector:
    matchLabels:
      {{- include "portage.labels" . | nindent 6 }}
      app.kubernetes.io/component: reconciler
  template:
    metadata:
      labels:
        {{- include "portage.labels" . | nindent 8 }}
        app.kubernetes.io/component: reconciler
    spec:
      containers:
        - name: reconciler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "reconciler.main"]
          ports:
            - name: metrics
              containerPort: {{ .Values.reconciler.metricsPort }}
          env:
            {{- include "portage.databaseEnv" . | nindent 12 }}
            - name: PORTAGE_RECONCILER_METRICS_PORT
              value: {{ .Values.reconciler.metricsPort | quote }}
            - name: PORTAGE_RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.reconciler.reconcileIntervalSeconds | quote }}
          envFrom:
            {{- include "portage.credentialsEnvFrom" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: metrics
          readinessProbe:
            tcpSocket:
              port: metrics
          resources:
            {{- toYaml .Values.reconciler.resources | nindent 12 }}
          {{- if .Values.reconciler.inClusterKubeconfig.enabled }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/portage
              readOnly: true
      volumes:
        - name: kubeconfig
          configMap:
            name: {{ include "portage.fullname" . }}-reconciler-kubeconfig
          {{- end }}
