image:
  repository: portage/control-plane
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Dedicated ServiceAccounts for the api/reconciler Deployments, instead of
# both running under the namespace's implicit `default` (the reconciler's
# RBAC grant below binds to this identity specifically, not `default`).
serviceAccount:
  create: true

# minAvailable: 1 PodDisruptionBudgets, one per component — only rendered
# when that component's own replicaCount is more than 1, since a PDB with
# minAvailable: 1 against a single-replica Deployment would block voluntary
# node draining entirely rather than protect availability.
podDisruptionBudget:
  enabled: true

api:
  replicaCount: 2
  port: 8000
  service:
    type: ClusterIP
  resources: {}

reconciler:
  replicaCount: 2
  metricsPort: 9091
  reconcileIntervalSeconds: 5
  resources: {}
  # Mounts a kubeconfig at /etc/portage/kubeconfig, built from the pod's
  # own ServiceAccount token/CA (standard in-cluster-auth-as-a-kubeconfig
  # trick — providers/execution/kubernetes/provider.py always calls
  # load_kube_config(), never load_incluster_config()). Only useful when
  # a kubernetes ExecutionProfile targets the *same* cluster the
  # reconciler runs in; register that profile with
  # config.kubeconfig_path = "/etc/portage/kubeconfig" to use it.
  inClusterKubeconfig:
    enabled: false
  # Opt-in (default off, matching this chart's other off-by-default knobs)
  # RBAC grant for the reconciler's own ServiceAccount — get/list/watch/
  # create/update/patch/delete on sparkapplications.spark.apache.org, plus
  # get/list/watch on pods/pods/log — the exact permissions
  # providers/execution/kubernetes/provider.py needs. Off by default
  # because which namespace(s) Spark workloads actually run in is
  # workload/environment-specific, not something this chart can assume;
  # enable it once you know where. Grants into the release namespace by
  # default; list any other namespaces Spark workloads run in under
  # additionalNamespaces.
  #
  # IMPORTANT, confirmed live during v1.0.0 release-hardening: the release
  # namespace alone is usually NOT where Spark workloads actually run —
  # check every registered kubernetes ExecutionProfile's own
  # config.namespace value (e.g. "default") and include each one here, or
  # every submission will fail with a genuine 403 Forbidden even though
  # RBAC is "enabled." A helm upgrade that changes serviceAccount.create
  # from false to true (or vice versa) also changes which ServiceAccount
  # identity the reconciler runs as — any RBAC grant bound to the old
  # identity (e.g. a hand-applied grant against the namespace's implicit
  # `default` ServiceAccount) becomes silently orphaned, not an error at
  # upgrade time.
  rbac:
    create: false
    additionalNamespaces: []

# spec §46: "external/HA PostgreSQL" — bring your own, not bundled by this
# chart. existingSecretName must name a Secret (created out-of-band) with
# a key (existingSecretKey) holding a postgresql+asyncpg:// URL, per
# control_plane/db.py's DATABASE_URL contract.
database:
  existingSecretName: ""
  existingSecretKey: DATABASE_URL

# Optional Secret whose keys are exposed as env vars (envFrom) to both the
# API and reconciler pods — populates whatever PORTAGE_*_ACCESS_KEY /
# PORTAGE_DATABRICKS_CLIENT_SECRET / etc. env vars the ExecutionProfile/
# StorageProfile rows' own credential_reference fields expect
# (control_plane/credentials.py). The chart doesn't enumerate these itself
# since the set of names is open-ended and profile-defined.
credentials:
  existingSecretName: ""

# spec §33-34/§67 (api/auth.py). mode: disabled|enforced — mirrors
# PORTAGE_AUTH_MODE's own default, so an unconfigured chart install still
# behaves like unconfigured `make dev` (every caller is PlatformAdmin).
auth:
  mode: disabled
  groupRoles: ""
  oidcJwksUri: ""
  oidcIssuer: ""
  oidcAudience: ""

# TLS terminates here, not in-process (spec §46 lists "Ingress/load
# balancer" and "TLS" as separate recommended items) — tlsSecretName is
# expected to hold a TLS keypair, e.g. issued by cert-manager when
# certManagerIssuer is set (adds the cert-manager.io/cluster-issuer
# annotation; the Certificate/Secret itself is cert-manager's concern,
# not this chart's).
ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecretName: ""
  certManagerIssuer: ""
  annotations: {}
